</style><text x="0" y="16" class="faint mono" font-size="11.5" font-weight="500" text-anchor="start" letter-spacing="0.6">ORDER PATH</text><rect x="0.5" y="34.5" width="154.2" height="80" rx="8" class="box" stroke-width="1"/><text x="14.0" y="67" class="ink sans" font-size="14" font-weight="600" text-anchor="start" letter-spacing="0">Agents</text><text x="14.0" y="87" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">LLM research proposes</text><text x="14.0" y="103" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">a trade with reasons</text><line x1="158.2" y1="74" x2="175.2" y2="74" class="arrow" stroke-width="1.2"/><path d="M175.2 70 L180.2 74 L175.2 78Z" class="tip"/><rect x="181.7" y="34.5" width="154.2" height="80" rx="8" class="box" stroke-width="1"/><text x="195.2" y="67" class="ink sans" font-size="14" font-weight="600" text-anchor="start" letter-spacing="0">Validate</text><text x="195.2" y="87" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">proposal must match</text><text x="195.2" y="103" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">a strict schema</text><line x1="339.4" y1="74" x2="356.4" y2="74" class="arrow" stroke-width="1.2"/><path d="M356.4 70 L361.4 74 L356.4 78Z" class="tip"/><rect x="362.9" y="34.5" width="154.2" height="80" rx="8" class="hot" stroke-width="1"/><text x="376.4" y="67" class="ink sans" font-size="14" font-weight="600" text-anchor="start" letter-spacing="0">Risk engine</text><text x="376.4" y="87" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">deterministic limits</text><text x="376.4" y="103" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">the AI cannot bypass</text><line x1="520.6" y1="74" x2="537.6" y2="74" class="arrow" stroke-width="1.2"/><path d="M537.6 70 L542.6 74 L537.6 78Z"