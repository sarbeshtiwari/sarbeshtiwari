"start" letter-spacing="0">ATS</text><text x="458" y="108" class="tomato serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" font-style="italic">LLM agents that can&#x27;t bypass the risk rules</text><rect x="458" y="130" width="13" height="13" rx="2" fill="none" class="tomato-s" stroke-width="1.6"/><path d="M461 136 l3 3 l6 -7" fill="none" class="tomato-s draw" style="--l:20;--t:0.60s" stroke-width="1.8" stroke-linecap="round"/><text x="480" y="142" class="ink hand" font-size="18" font-weight="500" text-anchor="start" letter-spacing="0">Claude API research agents</text><rect x="458" y="154" width="13" height="13" rx="2" fill="none" class="tomato-s" stroke-width="1.6"/><path d="M461 160 l3 3 l6 -7" fill="none" class="tomato-s draw" style="--l:20;--t:0.85s" stroke-width="1.8" stroke-linecap="round"/><text x="480" y="166" class="ink hand" font-size="18" font-weight="500" text-anchor="start" letter-spacing="0">Deterministic risk engine as a hard guardrail</text><rect x="458" y="178" width="13" height="13" rx="2" fill="none" class="tomato-s" stroke-width="1.6"/><path d="M461 184 l3 3 l6 -7" fill="none" class="tomato-s draw" style="--l:20;--t:1.10s" stroke-width="1.8" stroke-linecap="round"/><text x="480" y="190" class="ink hand" font-size="18" font-weight="500" text-anchor="start" letter-spacing="0">Full audit trail of agent decisions</text><rect x="458" y="226" width="63" height="22" rx="11" class="chip" stroke-width="1"/><text x="468" y="241" class="chip-t mono" font-size="9.5" font-weight="500" text-anchor="start" letter-spacing="0.8">PYTHON</text><rect x="527.2" y="226" width="70" height="22" rx="11" class="chip" stroke-width="1"/><text x="537.2" y="241" class="chip-t mono" font-size="9.5" font-weight="500" text-anchor="start" letter-spacing="0.8">FASTAPI</text><rect x="603.6" y="226" width="92" height="22" rx="11" class="chip" stroke-width="1"/><text x="613.6" y="241" class="chip-t mono" font-size="9.5" font-weight="500" text-anchor="start" letter-spacing="0.8">CLAUDE API</text><rect x="701.6" y="226" width="121" height="22" rx="11" class="chip" stroke-width="1"/><text x="711.6" y="241" class="chip-t mono" font-size="9.5" font-weight="500" text-anchor="start" letter-spacing="0.8">GROWW TRADEAPI</text><g transform="rotate(4 826 40)"><rect x="782" y="26" width="88" height="28" rx="3" fill="#f4b43a"/><text x="826" y="46" class="ink hand" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0">in progress</text></g></svg>
