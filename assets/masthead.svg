 flow" stroke-width="1.3"/><path d="M690 152 L683 156 L690 160Z" class="tip"/><path d="M560 150 C 520 140, 512 108, 540 76" class="arrow flow" stroke-width="1.3"/><path d="M535 79 L541 74 L543 82Z" class="tip"/><text x="770" y="90" class="acc write" style="--t:.6s" font-size="15" font-family="'Bradley Hand','Segoe Print','Comic Neue',cursive" text-anchor="end" transform="rotate(-4 770 90)">is it actually right?</text><text x="500" y="200" class="soft write" style="--t:1.6s" font-size="14" font-family="'Bradley Hand','Segoe Print','Comic Neue',cursive" transform="rotate(-2 500 200)">fix the step that failed, run it again</text><text x="880" y="24" class="faint mono" font-size="11" font-weight="500" text-anchor="end" letter-spacing="0">fig. 1</text></svg>
