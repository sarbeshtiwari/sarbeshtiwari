ont-size="16" font-weight="600" text-anchor="start" letter-spacing="0">trace</text><text x="458" y="50" class="mono" font-size="10.5" font-weight="500" text-anchor="start" letter-spacing="1.6" fill="#3e7b9e">LLM EVALUATION</text><text x="458" y="84" class="ink serif" font-size="26" font-weight="700" text-anchor="start" letter-spacing="0">Pencil Puzzle Bench</text><text x="458" y="108" class="tomato serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" font-style="italic">my evaluation tooling on an open benchmark</text><rect x="458" y="130" width="13" height="13" rx="2" fill="none" class="tomato-s" stroke-width="1.6"/><path d="M461 136 l3 3 l6 -7" fill="none" class="tomato-s draw" style="--l:20;--t:0.60s" stroke-width="1.8" stroke-linecap="round"/><text x="480" y="142" class="ink hand" font-size="18" font-weight="500" text-anchor="start" letter-spacing="0">Benchmark CLI: many models, seeds, dry runs</text><rect x="458" y="154" width="13" height="13" rx="2" fill="none" class="tomato-s" stroke-width="1.6"/><path d="M461 160 l3 3 l6 -7" fill="none" class="tomato-s draw" style="--l:20;--t:0.85s" stroke-width="1.8" stroke-linecap="round"/><text x="480" y="166" class="ink hand" font-size="18" font-weight="500" text-anchor="start" letter-spacing="0">JSONL trajectory trace for every run</text><rect x="458" y="178" width="13" height="13" rx="2" fill="none" class="tomato-s" stroke-width="1.6"/><path d="M461 184 l3 3 l6 -7" fill="none" class="tomato-s draw" style="--l:20;--t:1.10s" stroke-width="1.8" stroke-linecap="round"/><text x="480" y="190" class="ink hand" font-size="18" font-weight="500" text-anchor="start" letter-spacing="0">Bedrock + GLM; multi-run variance</text><rect x="458" y="226" width="63" height="22" rx="11" class="chip" stroke-width="1"/><text x="468" y="241" class="chip-t mono" font-size="9.5" font-weight="500" text-anchor="start" letter-spacing="0.8">PYTHON</text><rect x="527.2" y="226" width="99" height="22" rx="11" class="chip" stroke-width="1"/><text x="537.2" y="241" class="chip-t mono" font-size="9.5" font-weight="500" text-anchor="start" letter-spacing="0.8">AWS BEDROCK</text><rect x="632.4000000000001" y="226" width="78" height="22" rx="11" class="chip" stroke-width="1"/><text x="642.4" y="241" class="chip-t mono" font-size="9.5" font-weight="500" text-anchor="start" letter-spacing="0.8">LLM APIS</text></svg>
