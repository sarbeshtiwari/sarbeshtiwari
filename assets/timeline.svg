<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Experience: B.Tech in Data Science and AI at SRMU 2020 to 2024; Flutter developer at Aayan and iWashHub 2023 to 2024; full stack developer at Ecorp Info Systems July 2024 to February 2026; AI engineer at Ethara.ai via Quess since February 2026."><title>Experience: B.Tech in Data Science and AI at SRMU 2020 to 2024; Flutter developer at Aayan and iWashHub 2023 to 2024; full stack developer at Ecorp Info Systems July 2024 to February 2026; AI engineer at Ethara.ai via Quess since February 2026.</title><style>
.serif{font-family:'IBM Plex Serif','Iowan Old Style',Georgia,serif} .display{font-family:Fraunces,'Iowan Old Style',Georgia,serif} .sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace} .hand{font-family:Caveat,'Bradley Hand','Segoe Print','Comic Neue',cursive}
.paper{fill:#fffefd} .tint{fill:#f6f2ea} .edge{stroke:#ece5d7} .ink{fill:#1a1715} .soft{fill:#4a433d} .mute{fill:#8a8278}
