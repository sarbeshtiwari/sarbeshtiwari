<svg xmlns="http://www.w3.org/2000/svg" width="880" height="140" viewBox="0 0 880 140" role="img" aria-label="VoicePilot flow: microphone, local speech to text, agent in a pseudo-terminal, read the reply, speak it"><title>VoicePilot flow: microphone, local speech to text, agent in a pseudo-terminal, read the reply, speak it</title><style>
.flow{stroke-dasharray:5 5;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{stroke-width:1.2px;opacity:1}50%{stroke-width:2.6px;opacity:.85}}
.runner{animation:run var(--d,6s) cubic-bezier(.45,0,.55,1) infinite}
@keyframes run{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(var(--w));opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.write{animation:write 1.8s ease-out both;animation-delay:var(--t,.4s)}
@keyframes write{from{opacity:0;transform:translateY(4px)}}
.blink{animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.flow,.pulse,.runner,.grow,.write,.blink{animation:none}.runner{opacity:0}}
.ink{fill:#1f2328} .soft{fill:#59636e} .faint{fill:#818b98} .acc{fill:#0f766e}
.rule{stroke:#d1d9e0} .box{fill:#ffffff;stroke:#d1d9e0} .hot{fill:#f0fdfa;stroke:#0f766e} .arrow{stroke:#818b98;fill:none} .tip{fill:#818b98}
.serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.ink{fill:#e6edf3} .soft{fill:#9198a1} .faint{fill:#6e7681} .acc{fill:#2dd4bf}
.rule{stroke:#3d444d} .box{fill:#0d1117;stroke:#3d444d} .hot{fill:#0b2a27;stroke:#2dd4bf} .arrow{stroke:#6e7681} .tip{fill:#6e7681}}
</style><text x="0" y="16" class="faint mono" font-size="11.5" font-weight="500" text-anchor="start" letter-spacing="0.6">VOICE LOOP</text><rect x="0.5" y="34.5" width="154.2" height="80" rx="8" class="box" stroke-width="1"/><text x="14.0" y="67" class="ink sans" font-size="14" font-weight="600" text-anchor="start" letter-spacing="0">Listen</text><text x="14.0" y="87" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">stops recording</text><text x="14.0" y="103" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">on silence</text><line x1="158.2" y1="74" x2="175.2" y2="74" class="arrow flow" stroke-width="1.2"/><path d="M175.2 70 L180.2 74 L175.2 78Z" class="tip"/><rect x="181.7" y="34.5" width="154.2" height="80" rx="8" class="box" stroke-width="1"/><text x="195.2" y="67" class="ink sans" font-size="14" font-weight="600" text-anchor="start" letter-spacing="0">Transcribe</text><text x="195.2" y="87" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">faster-whisper or</text><text x="195.2" y="103" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">parakeet, on device</text><line x1="339.4" y1="74" x2="356.4" y2="74" class="arrow flow" stroke-width="1.2"/><path d="M356.4 70 L361.4 74 L356.4 78Z" class="tip"/><rect x="362.9" y="34.5" width="154.2" height="80" rx="8" class="hot pulse" stroke-width="1"/><text x="376.4" y="67" class="ink sans" font-size="14" font-weight="600" text-anchor="start" letter-spacing="0">Agent in a PTY</text><text x="376.4" y="87" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">Claude, Codex, Aider,</text><text x="376.4" y="103" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">Ollama run unchanged</text><line x1="520.6" y1="74" x2="537.6" y2="74" class="arrow flow" stroke-width="1.2"/><path d="M537.6 70 L542.6 74 L537.6 78Z" class="tip"/><rect x="544.1" y="34.5" width="154.2" height="80" rx="8" class="box" stroke-width="1"/><text x="557.6" y="67" class="ink sans" font-size="14" font-weight="600" text-anchor="start" letter-spacing="0">Read reply</text><text x="557.6" y="87" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">waits for output</text><text x="557.6" y="103" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">to go quiet</text><line x1="701.8" y1="74" x2="718.8" y2="74" class="arrow flow" stroke-width="1.2"/><path d="M718.8 70 L723.8 74 L718.8 78Z" class="tip"/><rect x="725.3" y="34.5" width="154.2" height="80" rx="8" class="box" stroke-width="1"/><text x="738.8" y="67" class="ink sans" font-size="14" font-weight="600" text-anchor="start" letter-spacing="0">Speak</text><text x="738.8" y="87" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">local text-to-speech;</text><text x="738.8" y="103" class="soft sans" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">no audio leaves</text><circle cx="8" cy="123" r="3.5" class="acc runner" style="--w:864px;--d:8.0s"/></svg>
